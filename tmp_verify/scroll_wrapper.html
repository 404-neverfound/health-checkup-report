<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>scroll to 3.3.3</title>
</head>
<body>
<iframe id="f" src="场景2_仅组件为零.html" style="width:1400px;height:10000px;border:0;"></iframe>
<script>
window.addEventListener('load', function () {
  setTimeout(function () {
    var doc = document.getElementById('f').contentDocument;
    var el = doc.getElementById('sec-protection-effectiveness');
    if (el) {
      el.scrollIntoView();
      // 输出该元素在 iframe 文档中的位置，供外部截图用
      var rect = el.getBoundingClientRect();
      var body = doc.body;
      // 定位到父文档
      var outer = document.getElementById('f');
      var orect = outer.getBoundingClientRect();
      var targetY = orect.top + rect.top;
      window.scrollTo(0, Math.max(0, targetY - 100));
    }
  }, 3000);
});
</script>
</body>
</html>
